<!DOCTYPE html>
<html lang="sd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Studio Pro Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: ltr; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; }
        h2 { text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-sync { background: #2563eb; color: white; }
        .btn-start { background: #16a34a; color: white; }
        .btn-stop { background: #dc2626; color: white; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stream Studio Pro Admin Panel</h2>

    <div class="form-group">
        <label>Facebook Stream Key:</label>
        <input type="text" id="fbKey" placeholder="Paste FB Stream Key Here">
    </div>

    <div class="form-group">
        <label>Video Stream URL:</label>
        <input type="text" id="videoUrl" value="https://aliakbarshar.github.io/live/TestTrack1.mp4">
    </div>

    <button class="btn btn-sync" onclick="saveSettings()">💾 Save & Sync All Settings</button>
    <button class="btn btn-start" onclick="toggleStream(true)">▶️ Start Cloud Broadcaster</button>
    <button class="btn btn-stop" onclick="toggleStream(false)">⏹️ Stop Stream</button>

    <div id="status">Status: Connecting...</div>
</div>

<script>
    const SUPABASE_URL = 'https://meywyyvqmrnpbzrzzhvm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1leXd5eXZxbXJucGJ6cnp6aHZtIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDM4Nzk2MiwiZXhwIjoyMTA1OTYzOTYyfQ.V3IuQuxRmK7npiS66RPn0SnYjnk7W2xo2pGvl_jWCtI';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadSettings() {
        const { data, error } = await _supabase.from('stream_config').select('*').eq('id', 1).single();
        if (data) {
            document.getElementById('fbKey').value = data.fb_key || '';
            if(data.playlist && data.playlist[0]) {
                document.getElementById('videoUrl').value = data.playlist[0].url;
            }
            document.getElementById('status').innerText = "Status: " + (data.is_live ? "🔴 Stream Active (LIVE)" : "⚪ Stream Stopped");
            document.getElementById('status').style.background = data.is_live ? "#15803d" : "#334155";
        }
    }

    async function saveSettings() {
        const fbKey = document.getElementById('fbKey').value.trim();
        const videoUrl = document.getElementById('videoUrl').value.trim();

        const { error } = await _supabase.from('stream_config').upsert({
            id: 1,
            fb_key: fbKey,
            playlist: [{ url: videoUrl }]
        });

        if (error) {
            alert('Error saving settings: ' + error.message);
        } else {
            alert('Settings Saved Successfully!');
            loadSettings();
        }
    }

    async function toggleStream(status) {
        const fbKey = document.getElementById('fbKey').value.trim();
        if(status && !fbKey) {
            alert("Please enter Facebook Stream Key first!");
            return;
        }

        const { error } = await _supabase.from('stream_config').update({ is_live: status }).eq('id', 1);
        if (error) {
            alert('Error changing status: ' + error.message);
        } else {
            alert(status ? "Starting Broadcaster..." : "Stopping Broadcaster...");
            loadSettings();
        }
    }

    loadSettings();
</script>

</body>
</html>
